<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banaani Simulaator</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍌</text></svg>">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121218;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid #333344;
        }
        canvas {
            display: block;
            background-color: #1e1e28;
            touch-action: none;
        }
        .hud-controls {
            position: absolute;
            top: 10px;
            right: 12px;
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        .ui-btn {
            background: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 6px;
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            backdrop-filter: blur(4px);
        }
        .ui-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .ui-btn:active {
            background: rgba(255, 255, 255, 0.4);
        }
        #putAwayBtn {
            position: absolute;
            bottom: 12px;
            right: 12px;
            display: none;
            background: rgba(231, 76, 60, 0.85);
            border-color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            padding: 8px 14px;
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="topControls" class="hud-controls">
        <button id="pauseBtn" class="ui-btn">⏸️ Paus</button>
        <button id="menuBtn" class="ui-btn">🏠 Menüü</button>
        <button id="fullscreenBtn" class="ui-btn">⛶</button>
    </div>

    <button id="putAwayBtn" class="ui-btn">Pane nuga ära</button>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const gameContainer = document.getElementById('gameContainer');

const fullscreenBtn = document.getElementById('fullscreenBtn');
const pauseBtn = document.getElementById('pauseBtn');
const menuBtn = document.getElementById('menuBtn');
const putAwayBtn = document.getElementById('putAwayBtn');

const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || /Mobi|Android/i.test(navigator.userAgent);

let gameState = "MENU"; 

const MAX_LEVELS = 10;

let highScore = {
    maxLevel: parseInt(localStorage.getItem('banaani_high_level')) || 1,
    totalCuts: parseInt(localStorage.getItem('banaani_total_cuts')) || 0
};

function saveStats(runLevel, runCuts) {
    if (runLevel > highScore.maxLevel) {
        highScore.maxLevel = runLevel;
        localStorage.setItem('banaani_high_level', highScore.maxLevel);
    }
    highScore.totalCuts += runCuts;
    localStorage.setItem('banaani_total_cuts', highScore.totalCuts);
}

const BANANA_SKINS = [
    { name: "Kollane (Klassikaline)", color: "#ffe135", type: "classic" },
    { name: "Roheline (Toores)", color: "#7ccd32", type: "classic" },
    { name: "Anatoomiline Käe-Banaan 🖐️", color: "#f1c27d", type: "hand" },
    { name: "Pruun (Üleküpsenud)", color: "#6e3c14", type: "classic" },
    { name: "Roosa (Rave)", color: "#ff69b4", type: "classic" }
];
let selectedSkinIndex = 0;

let leftArrowBtn = { x: 0, y: 0, w: 44, h: 36 };
let rightArrowBtn = { x: 0, y: 0, w: 44, h: 36 };
let resumeBtn = { x: 0, y: 0, w: 200, h: 48 };
let pauseToMenuBtn = { x: 0, y: 0, w: 200, h: 48 };

let level = 1;
let cutsCount = 0;
let totalRunCuts = 0; 
let targetCuts = 50;
let timeLeft = 60;
let timerInterval = null;
let isVictory = false;

const BOARD_COLORS = [
    { wood: '#a0522d', border: '#654321', name: 'Klassikaline Puit' },
    { wood: '#2e4053', border: '#1b2631', name: 'Tumesinine Marmor' },
    { wood: '#1e8449', border: '#145a32', name: 'Smaragdroheline' },
    { wood: '#7d6608', border: '#4d3e05', name: 'Kuldne Puit' },
    { wood: '#6c3483', border: '#4a235a', name: 'Müstiline Violetne' },
    { wood: '#ba4a00', border: '#7e2e00', name: 'Marmorpruun' },
    { wood: '#117a65', border: '#0e6251', name: 'Türkiissinine Marmor' },
    { wood: '#7b7d7d', border: '#4d5656', name: 'Kiviplaat' },
    { wood: '#9a7d0a', border: '#7d6608', name: 'Pronks' },
    { wood: '#b03a2e', border: '#78281f', name: 'Rubiin' }
];

let cuts = [];
let currentCut = null;
let juiceDrips = [];
let isCutting = false;

let knife = {
    x: 680,
    y: 420,
    width: 90,
    height: 35,
    isHeld: false
};

let mousePos = { x: 0, y: 0 };
let scale = 1;

function getTargetCutsForLevel(lvl) {
    return 50 + (lvl - 1) * 25;
}

function setupResolution() {
    if (isMobile) {
        canvas.width = 360;
        canvas.height = 640;
        const availW = window.innerWidth - 16;
        const availH = window.innerHeight - 16;
        scale = Math.min(availW / 360, availH / 640);
    } else {
        canvas.width = 800;
        canvas.height = 600;
        const availW = window.innerWidth - 40;
        const availH = window.innerHeight - 40;
        scale = Math.min(1, Math.min(availW / 800, availH / 600));
    }

    gameContainer.style.width = `${canvas.width * scale}px`;
    gameContainer.style.height = `${canvas.height * scale}px`;
    canvas.style.width = `${canvas.width * scale}px`;
    canvas.style.height = `${canvas.height * scale}px`;

    resumeBtn = { x: canvas.width / 2 - 100, y: canvas.height / 2 - 35, w: 200, h: 48 };
    pauseToMenuBtn = { x: canvas.width / 2 - 100, y: canvas.height / 2 + 25, w: 200, h: 48 };

    if (!knife.isHeld) {
        knife.x = canvas.width - 120;
        knife.y = canvas.height - 180;
    }
}
window.addEventListener('resize', setupResolution);
setupResolution();

function getCanvasCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    return {
        x: (clientX - rect.left) / scale,
        y: (clientY - rect.top) / scale
    };
}

function isInside(pos, rect) {
    return pos.x >= rect.x && pos.x <= rect.x + rect.w &&
           pos.y >= rect.y && pos.y <= rect.y + rect.h;
}

function updateMousePos(coords) {
    mousePos.x = coords.x;
    mousePos.y = coords.y;

    if (gameState === "GAME" && knife.isHeld) {
        knife.x = mousePos.x - 20;
        knife.y = mousePos.y - 10;

        if (isCutting && currentCut) {
            const lastPt = currentCut.points[currentCut.points.length - 1];
            const dist = Math.hypot(mousePos.x - lastPt.x, mousePos.y - lastPt.y);
            
            if (dist > 5) {
                currentCut.points.push({ x: mousePos.x, y: mousePos.y });

                for (let i = 0; i < 2; i++) {
                    juiceDrips.push({
                        x: mousePos.x + (Math.random() * 10 - 5),
                        y: mousePos.y + (Math.random() * 10 - 5),
                        radius: Math.random() * 4 + 2,
                        speedY: Math.random() * 1.5 + 0.5
                    });
                }
            }
        }
    }
}

function handleInputStart(coords) {
    if (gameState === "MENU") {
        if (isInside(coords, leftArrowBtn)) {
            selectedSkinIndex = (selectedSkinIndex - 1 + BANANA_SKINS.length) % BANANA_SKINS.length;
        } else if (isInside(coords, rightArrowBtn)) {
            selectedSkinIndex = (selectedSkinIndex + 1) % BANANA_SKINS.length;
        } else {
            startGame();
        }
    } else if (gameState === "GAME") {
        if (!knife.isHeld) {
            if (isMobile || (mousePos.x >= knife.x - 40 && mousePos.x <= knife.x + knife.width + 20 &&
                mousePos.y >= knife.y - 40 && mousePos.y <= knife.y + knife.height + 20)) {
                knife.isHeld = true;
            }
        } else {
            isCutting = true;
            currentCut = { points: [{ x: coords.x, y: coords.y }] };
        }
    } else if (gameState === "PAUSED") {
        if (isInside(coords, resumeBtn)) {
            resumeGame();
        } else if (isInside(coords, pauseToMenuBtn)) {
            goToMenu();
        }
    } else if (gameState === "GAME_OVER") {
        goToMenu();
    }
}

function handleInputEnd() {
    if (isCutting) {
        if (currentCut && currentCut.points.length > 1) {
            cuts.push(currentCut);
            cutsCount++;
            totalRunCuts++;

            if (cutsCount >= targetCuts) {
                if (level >= MAX_LEVELS) {
                    winGame();
                } else {
                    nextLevel();
                }
            }
        }
        isCutting = false;
        currentCut = null;
    }
}

function resetKnife() {
    knife.isHeld = false;
    isCutting = false;
    currentCut = null;
    knife.x = canvas.width - 120;
    knife.y = canvas.height - 180;
    updateUIElements();
}

canvas.addEventListener('mousemove', (e) => {
    updateMousePos(getCanvasCoordinates(e));
});

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        const coords = getCanvasCoordinates(e);
        updateMousePos(coords);
        handleInputStart(coords);
        updateUIElements();
    }
});

window.addEventListener('mouseup', (e) => {
    if (e.button === 0) {
        handleInputEnd();
    }
});

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (gameState === "GAME" && knife.isHeld) {
        resetKnife();
    }
});

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const coords = getCanvasCoordinates(e);
    updateMousePos(coords);
    handleInputStart(coords);
    updateUIElements();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    updateMousePos(getCanvasCoordinates(e));
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleInputEnd();
}, { passive: false });

fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
});

pauseBtn.addEventListener('click', () => {
    if (gameState === "GAME") {
        pauseGame();
    } else if (gameState === "PAUSED") {
        resumeGame();
    }
});

menuBtn.addEventListener('click', () => {
    goToMenu();
});

putAwayBtn.addEventListener('click', () => {
    resetKnife();
});

function pauseGame() {
    gameState = "PAUSED";
    stopTimer();
    updateUIElements();
}

function resumeGame() {
    gameState = "GAME";
    startTimer();
    updateUIElements();
}

function goToMenu() {
    stopTimer();
    gameState = "MENU";
    resetLevelData();
    updateUIElements();
}

function updateUIElements() {
    if (gameState === "MENU") {
        pauseBtn.style.display = "none";
        menuBtn.style.display = "none";
        putAwayBtn.style.display = "none";
    } else if (gameState === "GAME") {
        pauseBtn.style.display = "block";
        menuBtn.style.display = "block";
        putAwayBtn.style.display = (knife.isHeld && isMobile) ? "block" : "none";
    } else if (gameState === "PAUSED") {
        pauseBtn.style.display = "block";
        menuBtn.style.display = "block";
        putAwayBtn.style.display = "none";
    } else {
        pauseBtn.style.display = "none";
        menuBtn.style.display = "none";
        putAwayBtn.style.display = "none";
    }
}

window.addEventListener('keydown', (e) => {
    if (gameState === "MENU") {
        if (e.key === "ArrowRight") {
            selectedSkinIndex = (selectedSkinIndex + 1) % BANANA_SKINS.length;
        } else if (e.key === "ArrowLeft") {
            selectedSkinIndex = (selectedSkinIndex - 1 + BANANA_SKINS.length) % BANANA_SKINS.length;
        } else if (e.key === "Enter" || e.key === " ") {
            startGame();
        }
    } else if (gameState === "GAME") {
        if (e.key === "Escape" || e.key === "p" || e.key === "P") {
            pauseGame();
        } else if (e.key === "c" || e.key === "C") {
            cuts = [];
            juiceDrips = [];
            cutsCount = 0;
        }
    } else if (gameState === "PAUSED") {
        if (e.key === "Escape" || e.key === "p" || e.key === "P") {
            resumeGame();
        }
    }
});

// FIXED helper function (correct vertex rendering)
function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function startGame() {
    level = 1;
    totalRunCuts = 0;
    isVictory = false;
    resetLevelData();
    gameState = "GAME";
    updateUIElements();
    startTimer();
}

function resetLevelData() {
    cutsCount = 0;
    cuts = [];
    currentCut = null;
    juiceDrips = [];
    targetCuts = getTargetCutsForLevel(level);
    timeLeft = 25 + level * 35;
    knife.isHeld = false;
    knife.x = canvas.width - 120;
    knife.y = canvas.height - 180;
    isCutting = false;
}

function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
        if (gameState === "GAME") {
            timeLeft--;
            if (timeLeft <= 0) {
                stopTimer();
                isVictory = false;
                saveStats(level, totalRunCuts);
                gameState = "GAME_OVER";
                updateUIElements();
            }
        }
    }, 1000);
}

function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
}

function nextLevel() {
    level++;
    resetLevelData();
}

function winGame() {
    stopTimer();
    isVictory = true;
    saveStats(MAX_LEVELS, totalRunCuts);
    gameState = "GAME_OVER";
    updateUIElements();
}

function getBoardColor(lvl) {
    const idx = (lvl - 1) % BOARD_COLORS.length;
    return BOARD_COLORS[idx];
}

function drawBanana(cx, cy, skin) {
    ctx.save();

    if (skin.type === "hand") {
        ctx.fillStyle = skin.color;
        ctx.strokeStyle = "#b5834a";
        ctx.lineWidth = 4;
        ctx.lineJoin = "round";

        ctx.beginPath();
        ctx.moveTo(cx - 140, cy + 60);
        ctx.bezierCurveTo(cx - 60, cy + 90, cx + 20, cy + 60, cx + 80, cy + 20);

        ctx.lineTo(cx + 105, cy + 30);
        ctx.lineTo(cx + 120, cy + 15);
        ctx.lineTo(cx + 110, cy + 0);

        ctx.lineTo(cx + 130, cy - 10);
        ctx.lineTo(cx + 120, cy - 25);

        ctx.lineTo(cx + 135, cy - 40);
        ctx.lineTo(cx + 120, cy - 50);

        ctx.lineTo(cx + 110, cy - 55);
        ctx.lineTo(cx + 95, cy - 40);

        ctx.lineTo(cx + 75, cy - 45);
        ctx.lineTo(cx + 60, cy - 25);

        ctx.bezierCurveTo(cx + 10, cy - 10, cx - 50, cy + 10, cx - 120, cy + 10);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        ctx.strokeStyle = "rgba(180, 100, 50, 0.25)";
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo(cx - 110, cy + 35);
        ctx.bezierCurveTo(cx - 40, cy + 45, cx + 30, cy + 25, cx + 70, cy - 5);
        ctx.stroke();

    } else {
        ctx.beginPath();
        ctx.arc(cx, cy - 20, 115, 0.2 * Math.PI, 0.8 * Math.PI, false);
        ctx.lineWidth = 48;
        ctx.strokeStyle = skin.color;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy - 20, 115, 0.22 * Math.PI, 0.78 * Math.PI, false);
        ctx.lineWidth = 10;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.stroke();

        ctx.fillStyle = '#4a2e13';
        ctx.beginPath();
        ctx.arc(cx - 100, cy + 50, 9, 0, Math.PI * 2);
        ctx.arc(cx + 100, cy + 50, 9, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function drawKnifeObj(k) {
    ctx.save();
    
    ctx.fillStyle = '#e0e0e0';
    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    ctx.moveTo(k.x, k.y);
    ctx.lineTo(k.x + 60, k.y - 18);
    ctx.lineTo(k.x + 50, k.y + 10);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(k.x + 5, k.y - 2);
    ctx.lineTo(k.x + 55, k.y - 16);
    ctx.lineTo(k.x + 45, k.y + 5);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(k.x - 30, k.y - 8, 32, 14);

    ctx.fillStyle = '#f39c12';
    ctx.beginPath();
    ctx.arc(k.x - 20, k.y, 2, 0, Math.PI * 2);
    ctx.arc(k.x - 8, k.y, 2, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

function renderStroke(cutObj) {
    if (!cutObj || cutObj.points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(cutObj.points[0].x, cutObj.points[0].y);
    for (let i = 1; i < cutObj.points.length; i++) {
        ctx.lineTo(cutObj.points[i].x, cutObj.points[i].y);
    }
    ctx.stroke();
}

function renderMenu() {
    ctx.fillStyle = '#121218';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffe135';
    ctx.font = isMobile ? 'bold 28px Arial' : 'bold 44px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("BANAANI SIMULAATOR", canvas.width / 2, 80);

    const skin = BANANA_SKINS[selectedSkinIndex];
    const skinText = `Skinn: ${skin.name}`;
    ctx.font = isMobile ? '16px Arial' : '20px Arial';
    
    const textWidth = ctx.measureText(skinText).width;
    const padding = 20;
    
    leftArrowBtn.w = 44;
    leftArrowBtn.h = 36;
    leftArrowBtn.y = 135;
    leftArrowBtn.x = (canvas.width / 2) - (textWidth / 2) - leftArrowBtn.w - padding;

    rightArrowBtn.w = 44;
    rightArrowBtn.h = 36;
    rightArrowBtn.y = 135;
    rightArrowBtn.x = (canvas.width / 2) + (textWidth / 2) + padding;

    ctx.fillStyle = '#ffffff';
    ctx.fillText(skinText, canvas.width / 2, 160);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    drawRoundedRect(leftArrowBtn.x, leftArrowBtn.y, leftArrowBtn.w, leftArrowBtn.h, 6);
    ctx.fill(); 
    ctx.stroke();
    
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText("◀", leftArrowBtn.x + (leftArrowBtn.w / 2), leftArrowBtn.y + 24);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    drawRoundedRect(rightArrowBtn.x, rightArrowBtn.y, rightArrowBtn.w, rightArrowBtn.h, 6);
    ctx.fill(); 
    ctx.stroke();
    
    ctx.fillStyle = '#ffffff';
    ctx.fillText("▶", rightArrowBtn.x + (rightArrowBtn.w / 2), rightArrowBtn.y + 24);

    drawBanana(canvas.width / 2, 310, skin);

    ctx.fillStyle = '#2ecc71';
    ctx.font = isMobile ? '14px Arial' : '16px Arial';
    ctx.fillText(`🏆 Rekord Tase: ${highScore.maxLevel} / ${MAX_LEVELS} | Kokku lõikeid: ${highScore.totalCuts}`, canvas.width / 2, canvas.height - 130);

    ctx.font = isMobile ? '13px Arial' : '15px Arial';
    ctx.fillStyle = '#aaaa88';
    ctx.fillText("Muuda skini nooltega", canvas.width / 2, canvas.height - 90);
    ctx.fillText(isMobile ? "Puuduta ekraani alustamiseks" : "Vajuta [ENTER] või tee HIIRKLÕPS alustamiseks", canvas.width / 2, canvas.height - 60);
}

function renderGame() {
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const boardStyle = getBoardColor(level);
    const boardX = isMobile ? 20 : 120;
    const boardY = isMobile ? 80 : 90;
    const boardW = isMobile ? 320 : 560;
    const boardH = isMobile ? 480 : 420;
    
    ctx.fillStyle = boardStyle.wood;
    ctx.strokeStyle = boardStyle.border;
    ctx.lineWidth = 10;
    
    drawRoundedRect(boardX, boardY, boardW, boardH, 24);
    ctx.fill();
    ctx.stroke();

    const currentSkin = BANANA_SKINS[selectedSkinIndex];
    drawBanana(canvas.width / 2, boardY + boardH / 2, currentSkin);

    ctx.fillStyle = '#b30000';
    for (let i = juiceDrips.length - 1; i >= 0; i--) {
        let drip = juiceDrips[i];
        ctx.beginPath();
        ctx.arc(drip.x, drip.y, drip.radius, 0, Math.PI * 2);
        ctx.fill();

        drip.y += drip.speedY;
        drip.radius = Math.max(0.5, drip.radius - 0.01);
    }

    ctx.strokeStyle = '#660000';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    cuts.forEach(c => renderStroke(c));

    if (isCutting && currentCut) {
        renderStroke(currentCut);
    }

    drawKnifeObj(knife);

    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, canvas.width, 60);

    ctx.fillStyle = '#ffffff';
    ctx.font = isMobile ? 'bold 14px Arial' : 'bold 20px Arial';
    ctx.textAlign = 'left';

    if (isMobile) {
        ctx.fillText(`Tase: ${level}/${MAX_LEVELS}`, 10, 36);
        ctx.fillStyle = cutsCount >= targetCuts ? '#2ecc71' : '#ffcc00';
        ctx.fillText(`Lõiked: ${cutsCount}/${targetCuts}`, 105, 36);
        ctx.fillStyle = timeLeft <= 10 ? '#e74c3c' : '#ffffff';
        ctx.fillText(`Aeg: ${timeLeft}s`, 220, 36);
    } else {
        ctx.fillText(`Tase: ${level} / ${MAX_LEVELS}`, 20, 38);
        ctx.fillStyle = cutsCount >= targetCuts ? '#2ecc71' : '#ffcc00';
        ctx.fillText(`Kriimustusi: ${cutsCount} / ${targetCuts}`, 190, 38);
        ctx.fillStyle = timeLeft <= 10 ? '#e74c3c' : '#ffffff';
        ctx.fillText(`Aeg: ${timeLeft}s`, 450, 38);
    }

    if (!knife.isHeld) {
        ctx.fillStyle = '#ffffff';
        ctx.font = isMobile ? '13px Arial' : '16px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(isMobile ? "Puuduta ekraani noa võtmiseks!" : "Võta nuga kätte (klõpsa noale)!", canvas.width / 2, canvas.height - 20);
    } else {
        ctx.fillStyle = '#aaaaaa';
        ctx.font = isMobile ? '12px Arial' : '14px Arial';
        ctx.textAlign = 'center';
        const helpText = isMobile ? "Lohista noaga lõikamiseks" : "1 tõmme = 1 kriimustus | Paremklõps paneb noa ära";
        ctx.fillText(helpText, canvas.width / 2, canvas.height - 20);
    }
}

function renderPaused() {
    renderGame();

    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffe135';
    ctx.font = 'bold 40px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("PAUS", canvas.width / 2, canvas.height / 2 - 80);

    ctx.lineWidth = 2;

    ctx.fillStyle = 'rgba(46, 204, 113, 0.85)';
    ctx.strokeStyle = '#27ae60';
    drawRoundedRect(resumeBtn.x, resumeBtn.y, resumeBtn.w, resumeBtn.h, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText("Jätka mängu", canvas.width / 2, resumeBtn.y + 30);

    ctx.fillStyle = 'rgba(231, 76, 60, 0.85)';
    ctx.strokeStyle = '#c0392b';
    drawRoundedRect(pauseToMenuBtn.x, pauseToMenuBtn.y, pauseToMenuBtn.w, pauseToMenuBtn.h, 10);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText("Tagasi menüüsse", canvas.width / 2, pauseToMenuBtn.y + 30);
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(15, 15, 20, 0.93)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.textAlign = 'center';

    if (isVictory) {
        ctx.fillStyle = '#2ecc71';
        ctx.font = isMobile ? 'bold 36px Arial' : 'bold 48px Arial';
        ctx.fillText("PALJU ÕNNE! VÕIT! 🍌", canvas.width / 2, 140);
    } else {
        ctx.fillStyle = '#e74c3c';
        ctx.font = isMobile ? 'bold 36px Arial' : 'bold 48px Arial';
        ctx.fillText("AEG OTSAS!", canvas.width / 2, 140);
    }

    const boxW = isMobile ? 300 : 440;
    const boxH = isMobile ? 280 : 260;
    const boxX = canvas.width / 2 - boxW / 2;
    const boxY = 180;

    ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
    ctx.lineWidth = 2;
    drawRoundedRect(boxX, boxY, boxW, boxH, 12);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffe135';
    ctx.font = 'bold 22px Arial';
    ctx.fillText("📊 MÄNGU STATISTIKA", canvas.width / 2, boxY + 40);

    ctx.fillStyle = '#ffffff';
    ctx.font = isMobile ? '15px Arial' : '18px Arial';
    ctx.textAlign = 'left';
    const leftX = boxX + 30;

    ctx.fillText(`• Läbitud tasemed: ${isVictory ? MAX_LEVELS : level - 1} / ${MAX_LEVELS}`, leftX, boxY + 85);
    ctx.fillText(`• Lõikeid selles voorus: ${totalRunCuts}`, leftX, boxY + 120);

    const completedLevels = isVictory ? MAX_LEVELS : (level - 1);
    const avgCuts = completedLevels > 0 ? (totalRunCuts / completedLevels).toFixed(1) : 0;
    ctx.fillText(`• Keskmiselt lõikeid tasemel: ${avgCuts}`, leftX, boxY + 155);
    ctx.fillText(`• Eluaegseid lõikeid kokku: ${highScore.totalCuts}`, leftX, boxY + 190);

    ctx.textAlign = 'center';
    ctx.fillStyle = '#3498db';
    ctx.font = '16px Arial';
    ctx.fillText(isMobile ? "Puuduta ekraani menüüsse minemiseks" : "Tee klõps peamenüüsse minemiseks", canvas.width / 2, canvas.height - 60);
}

function gameLoop() {
    if (gameState === "MENU") {
        renderMenu();
    } else if (gameState === "GAME") {
        renderGame();
    } else if (gameState === "PAUSED") {
        renderPaused();
    } else if (gameState === "GAME_OVER") {
        renderGameOver();
    }
    requestAnimationFrame(gameLoop);
}

updateUIElements();
gameLoop();
</script>

</body>
</html>
