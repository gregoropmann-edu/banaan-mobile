<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Banaani Simulaator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #121218;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
        }
        #gameContainer {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            padding: 10px;
        }
        canvas {
            display: block;
            background-color: #1e1e28;
            box-shadow: 0 12px 40px rgba(0,0,0,0.8);
            border-radius: 12px;
            touch-action: none;
        }
        .ui-btn {
            position: absolute;
            background: rgba(0, 0, 0, 0.75);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            z-index: 10;
            backdrop-filter: blur(4px);
        }
        .ui-btn:active {
            background: rgba(255, 255, 255, 0.3);
        }
        #topRightControls {
            position: absolute;
            display: flex;
            gap: 6px;
            z-index: 10;
        }
        #putAwayBtn {
            position: absolute;
            display: none;
            background: rgba(231, 76, 60, 0.85);
            z-index: 10;
        }
    </style>
</head>
<body>

<div id="gameContainer">
    <div id="topRightControls">
        <button id="pauseBtn" class="ui-btn">⏸️ Paus</button>
        <button id="menuBtn" class="ui-btn">🏠 Menüü</button>
        <button id="fullscreenBtn" class="ui-btn">⛶</button>
    </div>

    <button id="putAwayBtn" class="ui-btn">Pane nuga ära</button>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const fullscreenBtn = document.getElementById('fullscreenBtn');
const pauseBtn = document.getElementById('pauseBtn');
const menuBtn = document.getElementById('menuBtn');
const putAwayBtn = document.getElementById('putAwayBtn');
const topRightControls = document.getElementById('topRightControls');

// Dynamic Device Detection
const isMobile = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || /Mobi|Android/i.test(navigator.userAgent);

let gameState = "MENU"; // "MENU", "GAME", "PAUSED", "GAME_OVER"

// Skins
const BANANA_SKINS = [
    { name: "Kollane (Klassikaline)", color: "#ffe135", type: "classic" },
    { name: "Roheline (Toores)", color: "#7ccd32", type: "classic" },
    { name: "Anatoomiline Käe-Banaan 🖐️", color: "#f1c27d", type: "hand" },
    { name: "Pruun (Üleküpsenud)", color: "#6e3c14", type: "classic" },
    { name: "Roosa (Rave)", color: "#ff69b4", type: "classic" }
];
let selectedSkinIndex = 0;

// Dynamic Arrow & Pause UI bounds
let leftArrowBtn = { x: 0, y: 0, w: 44, h: 36 };
let rightArrowBtn = { x: 0, y: 0, w: 44, h: 36 };
let resumeBtn = { x: 0, y: 0, w: 180, h: 44 };
let pauseToMenuBtn = { x: 0, y: 0, w: 180, h: 44 };

// Game Parameters
let level = 1;
let cutsCount = 0;
const TARGET_CUTS = 50;
let timeLeft = 60;
let timerInterval = null;

const BOARD_COLORS = [
    { wood: '#a0522d', border: '#654321', name: 'Klassikaline Puit' },
    { wood: '#2e4053', border: '#1b2631', name: 'Tumesinine Marmor' },
    { wood: '#1e8449', border: '#145a32', name: 'Smaragdroheline' },
    { wood: '#7d6608', border: '#4d3e05', name: 'Kuldne Puit' },
    { wood: '#6c3483', border: '#4a235a', name: 'Müstiline Violetne' },
    { wood: '#ba4a00', border: '#7e2e00', name: 'Marmorpruun' }
];

let cuts = [];
let currentCut = null;
let juiceDrips = [];
let isCutting = false;

let knife = {
    x: 0,
    y: 0,
    width: 70,
    height: 30,
    isHeld: false
};

let mousePos = { x: 0, y: 0 };
let scale = 1;

function fitCanvas() {
    const baseW = isMobile ? 360 : 640;
    const baseH = isMobile ? 640 : 480;

    canvas.width = baseW;
    canvas.height = baseH;

    const availableW = window.innerWidth - 20;
    const availableH = window.innerHeight - 20;

    scale = Math.min(availableW / baseW, availableH / baseH);

    const cssW = baseW * scale;
    const cssH = baseH * scale;

    canvas.style.width = `${cssW}px`;
    canvas.style.height = `${cssH}px`;

    // Position HTML overlay controls precisely over canvas
    const rect = canvas.getBoundingClientRect();
    
    topRightControls.style.top = `${rect.top + 8}px`;
    topRightControls.style.right = `${window.innerWidth - rect.right + 8}px`;

    putAwayBtn.style.bottom = `${window.innerHeight - rect.bottom + 12}px`;
    putAwayBtn.style.right = `${window.innerWidth - rect.right + 12}px`;

    // Recalculate canvas interactive bounds
    leftArrowBtn = { x: 20, y: 130, w: 44, h: 36 };
    rightArrowBtn = { x: baseW - 64, y: 130, w: 44, h: 36 };

    resumeBtn = { x: baseW / 2 - 90, y: baseH / 2 - 30, w: 180, h: 44 };
    pauseToMenuBtn = { x: baseW / 2 - 90, y: baseH / 2 + 25, w: 180, h: 44 };

    if (!knife.isHeld) {
        knife.x = baseW * 0.82;
        knife.y = baseH * 0.72;
    }
}
window.addEventListener('resize', fitCanvas);

function getCanvasCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    
    return {
        x: (clientX - rect.left) / scale,
        y: (clientY - rect.top) / scale
    };
}

function isInside(pos, rect) {
    return pos.x >= rect.x && pos.x <= rect.x + rect.w &&
           pos.y >= rect.y && pos.y <= rect.y + rect.h;
}

function updateMousePos(coords) {
    mousePos.x = coords.x;
    mousePos.y = coords.y;

    if (gameState === "GAME" && knife.isHeld) {
        knife.x = mousePos.x - 15;
        knife.y = mousePos.y - 8;

        if (isCutting && currentCut) {
            const lastPt = currentCut.points[currentCut.points.length - 1];
            const dist = Math.hypot(mousePos.x - lastPt.x, mousePos.y - lastPt.y);
            
            if (dist > 4) {
                currentCut.points.push({ x: mousePos.x, y: mousePos.y });

                for (let i = 0; i < 2; i++) {
                    juiceDrips.push({
                        x: mousePos.x + (Math.random() * 8 - 4),
                        y: mousePos.y + (Math.random() * 8 - 4),
                        radius: Math.random() * 3 + 1.5,
                        speedY: Math.random() * 1.2 + 0.4
                    });
                }
            }
        }
    }
}

function handleInputStart(coords) {
    if (gameState === "MENU") {
        if (isInside(coords, leftArrowBtn)) {
            selectedSkinIndex = (selectedSkinIndex - 1 + BANANA_SKINS.length) % BANANA_SKINS.length;
        } else if (isInside(coords, rightArrowBtn)) {
            selectedSkinIndex = (selectedSkinIndex + 1) % BANANA_SKINS.length;
        } else {
            startGame();
        }
    } else if (gameState === "GAME") {
        if (!knife.isHeld) {
            if (isMobile || (mousePos.x >= knife.x - 30 && mousePos.x <= knife.x + knife.width + 15 &&
                mousePos.y >= knife.y - 30 && mousePos.y <= knife.y + knife.height + 15)) {
                knife.isHeld = true;
            }
        } else {
            isCutting = true;
            currentCut = { points: [{ x: coords.x, y: coords.y }] };
        }
    } else if (gameState === "PAUSED") {
        if (isInside(coords, resumeBtn)) {
            resumeGame();
        } else if (isInside(coords, pauseToMenuBtn)) {
            goToMenu();
        }
    } else if (gameState === "GAME_OVER") {
        goToMenu();
    }
}

function handleInputEnd() {
    if (isCutting) {
        if (currentCut && currentCut.points.length > 1) {
            cuts.push(currentCut);
            cutsCount++;

            if (cutsCount >= TARGET_CUTS) {
                nextLevel();
            }
        }
        isCutting = false;
        currentCut = null;
    }
}

function resetKnife() {
    knife.isHeld = false;
    isCutting = false;
    currentCut = null;
    knife.x = canvas.width * 0.82;
    knife.y = canvas.height * 0.72;
    updateUIElements();
}

// Mouse Listeners
canvas.addEventListener('mousemove', (e) => {
    updateMousePos(getCanvasCoordinates(e));
});

canvas.addEventListener('mousedown', (e) => {
    if (e.button === 0) {
        const coords = getCanvasCoordinates(e);
        updateMousePos(coords);
        handleInputStart(coords);
        updateUIElements();
    }
});

window.addEventListener('mouseup', (e) => {
    if (e.button === 0) {
        handleInputEnd();
    }
});

canvas.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (gameState === "GAME" && knife.isHeld) {
        resetKnife();
    }
});

// Touch Listeners
canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const coords = getCanvasCoordinates(e);
    updateMousePos(coords);
    handleInputStart(coords);
    updateUIElements();
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    updateMousePos(getCanvasCoordinates(e));
}, { passive: false });

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    handleInputEnd();
}, { passive: false });

// Mobile & UI Buttons
fullscreenBtn.addEventListener('click', () => {
    if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
    } else {
        document.exitFullscreen().catch(() => {});
    }
});

pauseBtn.addEventListener('click', () => {
    if (gameState === "GAME") {
        pauseGame();
    } else if (gameState === "PAUSED") {
        resumeGame();
    }
});

menuBtn.addEventListener('click', () => {
    goToMenu();
});

putAwayBtn.addEventListener('click', () => {
    resetKnife();
});

function pauseGame() {
    gameState = "PAUSED";
    stopTimer();
    updateUIElements();
}

function resumeGame() {
    gameState = "GAME";
    startTimer();
    updateUIElements();
}

function goToMenu() {
    stopTimer();
    gameState = "MENU";
    resetLevelData();
    updateUIElements();
}

function updateUIElements() {
    if (gameState === "MENU") {
        pauseBtn.style.display = "none";
        menuBtn.style.display = "none";
        putAwayBtn.style.display = "none";
    } else if (gameState === "GAME") {
        pauseBtn.style.display = "block";
        menuBtn.style.display = "block";
        putAwayBtn.style.display = (knife.isHeld && isMobile) ? "block" : "none";
    } else if (gameState === "PAUSED") {
        pauseBtn.style.display = "block";
        menuBtn.style.display = "block";
        putAwayBtn.style.display = "none";
    } else {
        pauseBtn.style.display = "none";
        menuBtn.style.display = "none";
        putAwayBtn.style.display = "none";
    }
}

window.addEventListener('keydown', (e) => {
    if (gameState === "MENU") {
        if (e.key === "ArrowRight") {
            selectedSkinIndex = (selectedSkinIndex + 1) % BANANA_SKINS.length;
        } else if (e.key === "ArrowLeft") {
            selectedSkinIndex = (selectedSkinIndex - 1 + BANANA_SKINS.length) % BANANA_SKINS.length;
        } else if (e.key === "Enter" || e.key === " ") {
            startGame();
        }
    } else if (gameState === "GAME") {
        if (e.key === "Escape" || e.key === "p" || e.key === "P") {
            pauseGame();
        } else if (e.key === "c" || e.key === "C") {
            cuts = [];
            juiceDrips = [];
            cutsCount = 0;
        }
    } else if (gameState === "PAUSED") {
        if (e.key === "Escape" || e.key === "p" || e.key === "P") {
            resumeGame();
        }
    }
});

function drawRoundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function startGame() {
    level = 1;
    resetLevelData();
    gameState = "GAME";
    updateUIElements();
    startTimer();
}

function resetLevelData() {
    cutsCount = 0;
    cuts = [];
    currentCut = null;
    juiceDrips = [];
    timeLeft = Math.max(20, 60 - (level - 1) * 5);
    knife.isHeld = false;
    knife.x = canvas.width * 0.82;
    knife.y = canvas.height * 0.72;
    isCutting = false;
}

function startTimer() {
    stopTimer();
    timerInterval = setInterval(() => {
        if (gameState === "GAME") {
            timeLeft--;
            if (timeLeft <= 0) {
                stopTimer();
                gameState = "GAME_OVER";
                updateUIElements();
            }
        }
    }, 1000);
}

function stopTimer() {
    if (timerInterval) clearInterval(timerInterval);
}

function nextLevel() {
    level++;
    resetLevelData();
}

function getBoardColor(lvl) {
    const idx = (lvl - 1) % BOARD_COLORS.length;
    return BOARD_COLORS[idx];
}

function drawBanana(cx, cy, skin, scaleFactor = 1) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.scale(scaleFactor, scaleFactor);

    if (skin.type === "hand") {
        ctx.fillStyle = skin.color;
        ctx.strokeStyle = "#b5834a";
        ctx.lineWidth = 4;
        ctx.lineJoin = "round";

        ctx.beginPath();
        ctx.moveTo(-110, 45);
        ctx.bezierCurveTo(-50, 70, 15, 45, 60, 15);
        ctx.lineTo(80, 22);
        ctx.lineTo(95, 10);
        ctx.lineTo(85, 0);
        ctx.lineTo(100, -8);
        ctx.lineTo(90, -20);
        ctx.lineTo(102, -32);
        ctx.lineTo(90, -40);
        ctx.lineTo(82, -44);
        ctx.lineTo(72, -32);
        ctx.lineTo(58, -36);
        ctx.lineTo(46, -20);
        ctx.bezierCurveTo(8, -8, -40, 8, -95, 8);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

    } else {
        ctx.beginPath();
        ctx.arc(0, -15, 90, 0.2 * Math.PI, 0.8 * Math.PI, false);
        ctx.lineWidth = 38;
        ctx.strokeStyle = skin.color;
        ctx.lineCap = 'round';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -15, 90, 0.22 * Math.PI, 0.78 * Math.PI, false);
        ctx.lineWidth = 8;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.stroke();

        ctx.fillStyle = '#4a2e13';
        ctx.beginPath();
        ctx.arc(-80, 40, 7, 0, Math.PI * 2);
        ctx.arc(80, 40, 7, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

function drawKnifeObj(k) {
    ctx.save();
    
    ctx.fillStyle = '#e0e0e0';
    ctx.strokeStyle = '#555555';
    ctx.lineWidth = 2;
    
    ctx.beginPath();
    ctx.moveTo(k.x, k.y);
    ctx.lineTo(k.x + 45, k.y - 14);
    ctx.lineTo(k.x + 38, k.y + 8);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(k.x + 4, k.y - 2);
    ctx.lineTo(k.x + 40, k.y - 12);
    ctx.lineTo(k.x + 34, k.y + 4);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(k.x - 22, k.y - 6, 24, 11);

    ctx.restore();
}

function renderStroke(cutObj) {
    if (!cutObj || cutObj.points.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(cutObj.points[0].x, cutObj.points[0].y);
    for (let i = 1; i < cutObj.points.length; i++) {
        ctx.lineTo(cutObj.points[i].x, cutObj.points[i].y);
    }
    ctx.stroke();
}

function renderMenu() {
    ctx.fillStyle = '#121218';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffe135';
    ctx.font = isMobile ? 'bold 26px Arial' : 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("BANAANI SIMULAATOR", canvas.width / 2, 60);

    const skin = BANANA_SKINS[selectedSkinIndex];
    ctx.font = isMobile ? '15px Arial' : '18px Arial';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(`Skinn: ${skin.name}`, canvas.width / 2, 152);

    // Arrow Buttons
    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;

    drawRoundedRect(leftArrowBtn.x, leftArrowBtn.y, leftArrowBtn.w, leftArrowBtn.h, 6);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 18px Arial';
    ctx.fillText("◀", leftArrowBtn.x + leftArrowBtn.w / 2, leftArrowBtn.y + 24);

    ctx.fillStyle = 'rgba(255, 255, 255, 0.15)';
    drawRoundedRect(rightArrowBtn.x, rightArrowBtn.y, rightArrowBtn.w, rightArrowBtn.h, 6);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.fillText("▶", rightArrowBtn.x + rightArrowBtn.w / 2, rightArrowBtn.y + 24);

    drawBanana(canvas.width / 2, canvas.height * 0.52, skin, isMobile ? 0.8 : 0.95);

    ctx.font = isMobile ? '12px Arial' : '14px Arial';
    ctx.fillStyle = '#aaaa88';
    ctx.fillText("Muuda skini nooltega", canvas.width / 2, canvas.height - 50);
    ctx.fillText(isMobile ? "Puuduta ekraani alustamiseks" : "Vajuta [ENTER] või klõpsa alustamiseks", canvas.width / 2, canvas.height - 25);
}

function renderGame() {
    ctx.fillStyle = '#2c3e50';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    const boardStyle = getBoardColor(level);
    const marginX = isMobile ? 20 : 60;
    const marginY = isMobile ? 70 : 60;
    const boardW = canvas.width - (marginX * 2);
    const boardH = canvas.height - marginY - 60;
    
    ctx.fillStyle = boardStyle.wood;
    ctx.strokeStyle = boardStyle.border;
    ctx.lineWidth = 8;
    
    drawRoundedRect(marginX, marginY, boardW, boardH, 18);
    ctx.fill();
    ctx.stroke();

    const currentSkin = BANANA_SKINS[selectedSkinIndex];
    drawBanana(canvas.width / 2, marginY + boardH / 2, currentSkin, isMobile ? 0.8 : 0.9);

    ctx.fillStyle = '#b30000';
    for (let i = juiceDrips.length - 1; i >= 0; i--) {
        let drip = juiceDrips[i];
        ctx.beginPath();
        ctx.arc(drip.x, drip.y, drip.radius, 0, Math.PI * 2);
        ctx.fill();

        drip.y += drip.speedY;
        drip.radius = Math.max(0.5, drip.radius - 0.01);
    }

    ctx.strokeStyle = '#660000';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    cuts.forEach(c => renderStroke(c));

    if (isCutting && currentCut) {
        renderStroke(currentCut);
    }

    drawKnifeObj(knife);

    ctx.fillStyle = 'rgba(0,0,0,0.65)';
    ctx.fillRect(0, 0, canvas.width, 48);

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 13px Arial';
    ctx.textAlign = 'left';
    ctx.fillText(`Tase: ${level}`, 10, 28);

    ctx.fillStyle = cutsCount >= TARGET_CUTS ? '#2ecc71' : '#ffcc00';
    ctx.fillText(`Lõiked: ${cutsCount}/${TARGET_CUTS}`, isMobile ? 80 : 120, 28);

    ctx.fillStyle = timeLeft <= 10 ? '#e74c3c' : '#ffffff';
    ctx.fillText(`Aeg: ${timeLeft}s`, isMobile ? 180 : 250, 28);

    if (!knife.isHeld) {
        ctx.fillStyle = '#ffffff';
        ctx.font = '12px Arial';
        ctx.textAlign = 'center';
        ctx.fillText(isMobile ? "Puuduta ekraani noa võtmiseks!" : "Võta nuga kätte!", canvas.width / 2, canvas.height - 18);
    }
}

function renderPaused() {
    renderGame();

    ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffe135';
    ctx.font = 'bold 32px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("PAUS", canvas.width / 2, canvas.height / 2 - 60);

    ctx.lineWidth = 2;

    ctx.fillStyle = 'rgba(46, 204, 113, 0.85)';
    ctx.strokeStyle = '#27ae60';
    drawRoundedRect(resumeBtn.x, resumeBtn.y, resumeBtn.w, resumeBtn.h, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px Arial';
    ctx.fillText("Jätka mängu", canvas.width / 2, resumeBtn.y + 27);

    ctx.fillStyle = 'rgba(231, 76, 60, 0.85)';
    ctx.strokeStyle = '#c0392b';
    drawRoundedRect(pauseToMenuBtn.x, pauseToMenuBtn.y, pauseToMenuBtn.w, pauseToMenuBtn.h, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 16px Arial';
    ctx.fillText("Tagasi menüüsse", canvas.width / 2, pauseToMenuBtn.y + 27);
}

function renderGameOver() {
    ctx.fillStyle = 'rgba(15, 15, 20, 0.9)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#e74c3c';
    ctx.font = isMobile ? 'bold 28px Arial' : 'bold 36px Arial';
    ctx.textAlign = 'center';
    ctx.fillText("AEG OTSAS!", canvas.width / 2, canvas.height * 0.35);

    ctx.fillStyle = '#ffffff';
    ctx.font = '16px Arial';
    ctx.fillText(`Tase: ${level}`, canvas.width / 2, canvas.height * 0.48);
    ctx.fillText(`Kriimustusi: ${cutsCount}`, canvas.width / 2, canvas.height * 0.55);

    ctx.fillStyle = '#3498db';
    ctx.font = '14px Arial';
    ctx.fillText("Puuduta ekraani / tee klõps tagasiminekuks", canvas.width / 2, canvas.height * 0.72);
}

function gameLoop() {
    if (gameState === "MENU") {
        renderMenu();
    } else if (gameState === "GAME") {
        renderGame();
    } else if (gameState === "PAUSED") {
        renderPaused();
    } else if (gameState === "GAME_OVER") {
        renderGameOver();
    }
    requestAnimationFrame(gameLoop);
}

fitCanvas();
updateUIElements();
gameLoop();
</script>

</body>
</html>
